{% extends "base.html" %}
{% block title %}New Case{% endblock %}
{% block content %}
<div class="row justify-content-center"><div class="col-lg-8">
<div class="panel sticker pop">
  <div class="d-flex align-items-center gap-3 mb-2">
    <svg class="char bob" style="width:90px" viewBox="0 0 200 230" aria-hidden="true"><use href="#detective"/></svg>
    <div><h2 class="mb-1">🗂️ Create New Case</h2><p class="muted mb-0">Register the investigation before adding digital evidence.</p></div>
  </div>
  <form method="post">
    <label class="form-label">Case title</label>
    <input class="form-control form-control-lg mb-3" name="title" placeholder="e.g. Unauthorized Account Access" required>
    <label class="form-label">Case description</label>
    <textarea class="form-control mb-4" name="description" rows="6" placeholder="Enter the known facts and purpose of the investigation..."></textarea>
    <div class="d-flex flex-wrap gap-2"><button class="btn btn-cc btn-purple">🚀 Create Case</button><a class="btn btn-cc btn-white" href="{{ url_for('cases') }}">Cancel</a></div>
  </form>
</div></div></div>
{% endblock %}
